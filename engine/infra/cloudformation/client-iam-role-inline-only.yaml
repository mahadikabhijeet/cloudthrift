AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  FinOps Platform - Pillar A: Cross-Account IAM Role (inline-only fallback).
  Use this template when iam:AttachRolePolicy is not permitted in the target account.
  All permissions are defined as inline policies on the role — nothing hidden.

Parameters:
  CentralAccountId:
    Type: String
    Description: AWS Account ID of the central FinOps platform account that will assume this role.
    AllowedPattern: '[0-9]{12}'
    ConstraintDescription: Must be a valid 12-digit AWS account ID.

  ExternalId:
    Type: String
    Description: Shared secret External ID for cross-account role assumption. Treat this like a password.
    MinLength: 8
    MaxLength: 128
    NoEcho: true

  RoleName:
    Type: String
    Default: FinOps-Audit-ReadOnly-Role
    Description: Name for the cross-account IAM role.
    AllowedPattern: '[a-zA-Z0-9+=,.@_/-]+'
    ConstraintDescription: Must be a valid IAM role name.

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment tag value.

  EnableCURAccess:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Grant read access to Cost and Usage Report S3 bucket (only needed if this account owns the CUR bucket).

Conditions:
  CURAccessEnabled: !Equals [!Ref EnableCURAccess, 'true']

Resources:

  FinOpsCrossAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only cross-account role for FinOps platform cost and resource auditing.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowFinOpsPlatformAssumption
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${CentralAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId

      # ------------------------------------------------------------------
      # All permissions are inline — nothing is hidden in a managed policy.
      # Every action below is a read-only Get*/Describe*/List* call.
      #
      # Policy 1: FinOps-ResourceDiscovery
      #   Replaces ViewOnlyAccess for the services FinOps actually reads.
      #   Covers EC2, RDS, Lambda, ECS, EKS, ELB, Auto Scaling, S3,
      #   CloudWatch metrics, CloudTrail, resource tags, Compute Optimizer.
      #
      # Policy 2: FinOps-BillingAndCost
      #   Replaces AWSBillingReadOnlyAccess plus Cost Explorer, Pricing,
      #   Savings Plans, Budgets, Free Tier, Organizations, Trusted Advisor.
      #
      # Policy 3 (conditional): FinOps-CURBucketRead
      #   S3 read access to the CUR bucket. Only attached when
      #   EnableCURAccess=true. Off by default.
      # ------------------------------------------------------------------
      Policies:

        - PolicyName: FinOps-ResourceDiscovery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ComputeRead
                Effect: Allow
                Action:
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeInstanceTypes'
                  - 'ec2:DescribeInstanceStatus'
                  - 'ec2:DescribeReservedInstances'
                  - 'ec2:DescribeReservedInstancesModifications'
                  - 'ec2:DescribeImages'
                  - 'ec2:DescribeVolumes'
                  - 'ec2:DescribeSnapshots'
                  - 'ec2:DescribeAddresses'
                  - 'ec2:DescribeNatGateways'
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:DescribeRegions'
                  - 'ec2:DescribeAvailabilityZones'
                  - 'rds:DescribeDBInstances'
                  - 'rds:DescribeDBClusters'
                  - 'rds:DescribeReservedDBInstances'
                  - 'rds:DescribeReservedDBInstancesOfferings'
                  - 'rds:ListTagsForResource'
                  - 'lambda:ListFunctions'
                  - 'lambda:GetFunctionConfiguration'
                  - 'lambda:ListTags'
                  - 'ecs:ListClusters'
                  - 'ecs:DescribeClusters'
                  - 'ecs:ListServices'
                  - 'ecs:DescribeServices'
                  - 'eks:ListClusters'
                  - 'eks:DescribeCluster'
                  - 'autoscaling:DescribeAutoScalingGroups'
                  - 'autoscaling:DescribePolicies'
                Resource: '*'

              - Sid: NetworkAndStorageRead
                Effect: Allow
                Action:
                  - 'elasticloadbalancing:DescribeLoadBalancers'
                  - 'elasticloadbalancing:DescribeTargetGroups'
                  - 'elasticloadbalancing:DescribeTargetHealth'
                  - 's3:ListAllMyBuckets'
                  - 's3:GetBucketLocation'
                  - 's3:GetBucketTagging'
                  - 's3:GetBucketVersioning'
                  - 'cloudwatch:GetMetricData'
                  - 'cloudwatch:GetMetricStatistics'
                  - 'cloudwatch:ListMetrics'
                  - 'cloudtrail:LookupEvents'
                  - 'tag:GetResources'
                  - 'tag:GetTagKeys'
                  - 'tag:GetTagValues'
                Resource: '*'

              - Sid: ComputeOptimizerRead
                Effect: Allow
                Action:
                  - 'compute-optimizer:GetEC2InstanceRecommendations'
                  - 'compute-optimizer:GetEC2RecommendationProjectedMetrics'
                  - 'compute-optimizer:GetAutoScalingGroupRecommendations'
                  - 'compute-optimizer:GetEBSVolumeRecommendations'
                  - 'compute-optimizer:GetLambdaFunctionRecommendations'
                  - 'compute-optimizer:GetEnrollmentStatus'
                  - 'compute-optimizer:DescribeRecommendationExportJobs'
                Resource: '*'

        - PolicyName: FinOps-BillingAndCost
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CostExplorerRead
                Effect: Allow
                Action:
                  - 'ce:GetCostAndUsage'
                  - 'ce:GetCostAndUsageWithResources'
                  - 'ce:GetCostForecast'
                  - 'ce:GetReservationCoverage'
                  - 'ce:GetReservationPurchaseRecommendation'
                  - 'ce:GetReservationUtilization'
                  - 'ce:GetRightsizingRecommendation'
                  - 'ce:GetSavingsPlansCoverage'
                  - 'ce:GetSavingsPlansUtilization'
                  - 'ce:GetSavingsPlansUtilizationDetails'
                  - 'ce:GetDimensionValues'
                  - 'ce:GetTags'
                  - 'ce:GetUsageForecast'
                  - 'ce:ListCostAllocationTags'
                  - 'ce:ListCostCategoryDefinitions'
                Resource: '*'

              - Sid: PricingAndSavingsPlansRead
                Effect: Allow
                Action:
                  - 'pricing:DescribeServices'
                  - 'pricing:GetAttributeValues'
                  - 'pricing:GetProducts'
                  - 'savingsplans:DescribeSavingsPlans'
                  - 'savingsplans:DescribeSavingsPlansOfferings'
                  - 'savingsplans:DescribeSavingsPlanRates'
                  - 'savingsplans:ListTagsForResource'
                Resource: '*'

              - Sid: BillingConsoleRead
                Effect: Allow
                Action:
                  - 'billing:GetBillingData'
                  - 'billing:GetBillDetails'
                  - 'billing:GetPreferences'
                  - 'billing:ListBillingViews'
                  - 'budgets:DescribeBudgets'
                  - 'budgets:ViewBudget'
                  - 'cur:DescribeReportDefinitions'
                  - 'freetier:GetFreeTierAlertThreshold'
                  - 'freetier:GetFreeTierUsage'
                Resource: '*'

              - Sid: OrgAndSupportRead
                Effect: Allow
                Action:
                  - 'organizations:DescribeAccount'
                  - 'organizations:DescribeOrganization'
                  - 'organizations:ListAccounts'
                  - 'organizations:ListTagsForResource'
                  - 'support:DescribeTrustedAdvisorChecks'
                  - 'support:DescribeTrustedAdvisorCheckResult'
                Resource: '*'

        - !If
          - CURAccessEnabled
          - PolicyName: FinOps-CURBucketRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: CURBucketRead
                  Effect: Allow
                  Action:
                    - 's3:GetObject'
                    - 's3:ListBucket'
                    - 's3:GetBucketLocation'
                  Resource:
                    - !Sub 'arn:aws:s3:::cur-${AWS::AccountId}-*'
                    - !Sub 'arn:aws:s3:::cur-${AWS::AccountId}-*/*'
          - !Ref AWS::NoValue

      Tags:
        - Key: ManagedBy
          Value: FinOpsPlatform
        - Key: Pillar
          Value: A
        - Key: Environment
          Value: !Ref Environment
        - Key: CentralAccountId
          Value: !Ref CentralAccountId
        - Key: PolicyMode
          Value: inline-only

Outputs:
  RoleArn:
    Description: ARN of the FinOps cross-account IAM role. Provide this to the platform team.
    Value: !GetAtt FinOpsCrossAccountRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'

  RoleName:
    Description: Name of the FinOps cross-account IAM role.
    Value: !Ref FinOpsCrossAccountRole
    Export:
      Name: !Sub '${AWS::StackName}-RoleName'

  AccountId:
    Description: AWS Account ID where this role was deployed.
    Value: !Ref AWS::AccountId

  Region:
    Description: AWS Region where this stack was deployed.
    Value: !Ref AWS::Region

  PolicyMode:
    Description: Policy mode used for this deployment.
    Value: inline-only
